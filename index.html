<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <title>爺ぴーてぃー 3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="identity">
        <div class="avatar" aria-hidden="true">爺</div>
        <div>
          <h1>爺ぴーてぃー 3</h1>
          <p id="world-status">小さな和室</p>
        </div>
      </div>
      <button id="reset-button" class="ghost" type="button" title="このブラウザの記憶を消す">リセット</button>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-label="会話"></section>
    <div id="typing" class="typing" hidden>爺が考えています…</div>

    <form id="chat-form" class="composer">
      <label class="sr-only" for="message-input">メッセージ</label>
      <textarea id="message-input" rows="1" maxlength="600" placeholder="話しかける…" autocomplete="off"></textarea>
      <button type="submit" class="send">送る</button>
    </form>

    <footer>
      LLM・API・サーバなし。ここにいる爺は、このブラウザの中だけで暮らしています。
    </footer>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
